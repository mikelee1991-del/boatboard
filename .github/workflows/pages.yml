# Deploy static BoatBoard to GitHub Pages from repo root.
# One-time: Repo Settings → Pages → Source = GitHub Actions.
name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Attempts to enable Pages with GitHub Actions as the build source.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Whole root: dashboard + dive-engine + embeds. Tooling JS is inert in the browser.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
