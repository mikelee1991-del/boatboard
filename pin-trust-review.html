<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pin Trust Review — SoCal Boat Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root {
  --bg: #070b12; --card: #0e1520; --line: #243041; --ink: #e8ecf4;
  --ink2: #9aabbc; --ink3: #6e8094; --cyan: #4ec4e0; --good: #3dff9a;
  --bad: #ff6b4a; --amber: #ffc857; --mono: ui-monospace, Consolas, monospace;
  --near: #7dd3fc; --group: #c4b5fd;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, sans-serif; }
a { color: var(--cyan); }
header {
  padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--card);
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
}
header h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -0.02em; }
.stats { font-size: 12px; color: var(--ink2); flex: 1; min-width: 140px; }
.stats strong { color: var(--ink); }
header .hdr-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-left: auto; }
#btnHardRefresh {
  background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
  min-height: 40px; touch-action: manipulation; white-space: nowrap;
}
#btnHardRefresh:disabled { opacity: .65; cursor: wait; }
.hard-refresh-block {
  margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line);
}
.hard-refresh-block p {
  margin: 0 0 8px; font-size: 11px; color: var(--ink3); line-height: 1.45;
}
.hard-refresh-block button {
  width: 100%; min-height: 44px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); cursor: pointer; font-weight: 600; font-size: 12px;
  touch-action: manipulation;
}
.hard-refresh-block button:disabled { opacity: .65; cursor: wait; }
.layout {
  display: grid; grid-template-columns: minmax(320px, 380px) 1fr;
  height: calc(100% - var(--hdr, 56px));
}
aside {
  border-right: 1px solid var(--line); background: var(--card);
  display: flex; flex-direction: column; min-height: 0;
}
.toolbar {
  padding: 8px 10px; border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
}
.toolbar select, .toolbar input {
  background: var(--bg); color: var(--ink); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 8px; font-size: 12px;
}
.toolbar input { flex: 1; min-width: 100px; }
.list { overflow: auto; flex: 1; }
.item {
  padding: 8px 10px; border-bottom: 1px solid var(--line); cursor: pointer;
  display: grid; gap: 2px;
}
.item:hover { background: rgba(78,196,224,.06); }
.item.active { background: rgba(78,196,224,.14); }
.item.in-sel { box-shadow: inset 3px 0 0 var(--group); }
.item .nm { font-size: 12px; font-weight: 600; }
.item .meta { font-size: 10px; color: var(--ink3); font-family: var(--mono); }
.badge {
  display: inline-block; font-size: 9px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .04em; padding: 1px 5px; border-radius: 4px; margin-right: 4px;
}
.badge.high { background: rgba(255,107,74,.2); color: var(--bad); }
.badge.medium { background: rgba(255,200,87,.15); color: var(--amber); }
.badge.low { background: rgba(110,128,148,.2); color: var(--ink2); }
.badge.yes { background: rgba(61,255,154,.15); color: var(--good); }
.badge.no { background: rgba(255,107,74,.2); color: var(--bad); }
.badge.unsure { background: rgba(255,200,87,.15); color: var(--amber); }
.badge.pending { background: rgba(110,128,148,.15); color: var(--ink3); }
.badge.fish { background: rgba(78,196,224,.12); color: var(--cyan); }
.badge.dive { background: rgba(196,181,253,.15); color: var(--group); }
.badge.dual { background: rgba(61,255,154,.12); color: var(--good); }
.badge.live { background: rgba(125,211,252,.12); color: var(--near); }
.badge.cand { background: rgba(255,200,87,.1); color: var(--amber); }
.badge.off { background: rgba(255,107,74,.12); color: var(--bad); }
.dual-banner {
  margin: 8px 0; padding: 8px 10px; border-radius: 8px;
  border: 1px solid rgba(61,255,154,.35); background: rgba(61,255,154,.08);
  font-size: 12px; color: var(--ink2); line-height: 1.45;
}
.dual-banner strong { color: var(--good); }
.dual-banner .dual-ids { font-family: var(--mono); font-size: 10px; color: var(--ink3); margin-top: 4px; }
.dual-banner button {
  margin-top: 6px; background: var(--bg); color: var(--ink2); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 10px; font-size: 11px; cursor: pointer;
  min-height: 36px; touch-action: manipulation;
}
.map-wrap { position: relative; min-height: 0; }
#map { height: 100%; min-height: 360px; background: #0b2a33; }
#map.seafloor-leaflet { background: #0a1520 !important; }
#map.seafloor-leaflet .leaflet-tile-pane { filter: brightness(.92) contrast(1.05) saturate(.92); }
#map.seafloor-dem { background: #0b2a33 !important; }
#map.seafloor-dem .leaflet-tile-pane { filter: brightness(.95) contrast(1.08) saturate(1.05); }
#map.seafloor-enc { background: #b7cfe0 !important; }
#map.seafloor-enc .leaflet-tile-pane { filter: none; }
#map .leaflet-control-layers {
  background: rgba(6, 10, 16, .9); color: var(--ink2);
  border: 1px solid var(--line); border-radius: 8px;
}
#map .leaflet-control-layers-toggle { background-color: rgba(6, 10, 16, .9); }
#map .leaflet-control-layers label { color: var(--ink2); font-size: 12px; }
#map .leaflet-control-attribution {
  background: rgba(8, 12, 18, .82); color: var(--ink3); font-size: 9px; max-width: 70%;
}
.panel {
  position: absolute; top: 10px; right: 10px; z-index: 900; width: min(400px, calc(100% - 20px));
  background: rgba(8,12,18,.94); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.45); max-height: calc(100% - 20px); overflow: auto;
}
.panel h2 { margin: 0 0 6px; font-size: 15px; }
.panel h3 {
  margin: 14px 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .04em;
  text-transform: uppercase; color: var(--ink3); border-top: 1px solid var(--line); padding-top: 10px;
}
.panel .coords { font-family: var(--mono); font-size: 11px; color: var(--cyan); margin-bottom: 8px; }
.panel .src, .panel .why, .panel .about { font-size: 12px; color: var(--ink2); margin: 6px 0; }
.panel .about { color: var(--ink); }
.panel .src a { word-break: break-all; }
.panel label.note-lab { display: block; font-size: 11px; color: var(--ink3); margin-top: 8px; }
.panel textarea, .panel input[type="text"], .panel select.inline {
  width: 100%; margin-top: 4px; background: var(--bg); color: var(--ink);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: 12px/1.4 system-ui;
}
.panel textarea { min-height: 52px; resize: vertical; }
.btns { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.btns button {
  flex: 1; min-width: 72px; min-height: 40px; border-radius: 8px; border: 1px solid var(--line);
  font-weight: 700; font-size: 13px; cursor: pointer; touch-action: manipulation;
}
.btns .yes { background: rgba(61,255,154,.18); color: var(--good); border-color: rgba(61,255,154,.4); }
.btns .no { background: rgba(255,107,74,.18); color: var(--bad); border-color: rgba(255,107,74,.4); }
.btns .unsure { background: rgba(255,200,87,.14); color: var(--amber); border-color: rgba(255,200,87,.35); }
.btns button.active-yes { outline: 2px solid var(--good); }
.btns button.active-no { outline: 2px solid var(--bad); }
.btns button.active-unsure { outline: 2px solid var(--amber); }
.nav { display: flex; gap: 6px; margin-top: 8px; }
.nav button, .export-row button, .export-row label, .sec-btns button {
  background: var(--bg); color: var(--ink2); border: 1px solid var(--line); border-radius: 6px;
  padding: 8px 10px; font-size: 12px; cursor: pointer; min-height: 40px; touch-action: manipulation;
}
.sec-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.sec-btns button.primary { background: rgba(196,181,253,.15); color: var(--group); border-color: rgba(196,181,253,.4); font-weight: 700; }
.export-row {
  display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--line); align-items: center;
}
.howto {
  margin-top: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: rgba(0,0,0,.28); color: var(--ink2); font-size: 11px; line-height: 1.5;
}
.howto > summary {
  cursor: pointer; font-size: 12px; font-weight: 700; color: var(--ink);
  letter-spacing: .02em; list-style: none; touch-action: manipulation;
}
.howto > summary::-webkit-details-marker { display: none; }
.howto > summary::before {
  content: '▸ '; color: var(--cyan); font-weight: 700;
}
.howto[open] > summary::before { content: '▾ '; }
.howto ol {
  margin: 8px 0 0; padding-left: 1.2em;
}
.howto li { margin: 0 0 5px; }
.howto code {
  font-family: var(--mono); font-size: 10px; color: var(--cyan);
  background: rgba(78,196,224,.08); padding: 1px 4px; border-radius: 3px;
}
.howto .warn { color: var(--amber); }
.hint { font-size: 11px; color: var(--ink3); margin-top: 8px; }
.near-row, .grp-row {
  display: grid; gap: 2px; padding: 8px; margin: 4px 0; border: 1px solid var(--line);
  border-radius: 8px; cursor: pointer; touch-action: manipulation; background: rgba(0,0,0,.2);
}
.near-row:hover, .grp-row:hover { border-color: var(--cyan); }
.near-row.sel, .grp-row.sel { border-color: var(--group); background: rgba(196,181,253,.1); }
.near-row .t, .grp-row .t { font-size: 12px; font-weight: 600; }
.near-row .m, .grp-row .m { font-size: 10px; color: var(--ink3); font-family: var(--mono); }
.near-tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
.near-tools label { font-size: 11px; color: var(--ink3); }
.near-tools select { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-height: 36px; }
.sel-chip { font-size: 11px; color: var(--group); margin: 4px 0; }
.toast {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 2000;
  background: #152030; border: 1px solid var(--cyan); color: var(--ink); padding: 8px 14px;
  border-radius: 8px; font-size: 12px; display: none;
}
.map-legend {
  position: absolute; left: 10px; bottom: 28px; z-index: 900;
  background: rgba(8,12,18,.9); border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 10px; font-size: 10px; color: var(--ink2); line-height: 1.6;
  max-width: min(260px, calc(100% - 20px));
}
.map-legend .lg-title {
  font-size: 9px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink3); margin-bottom: 2px;
}
.map-legend .lg-meta { color: var(--ink3); margin-top: 4px; font-family: var(--mono); font-size: 9px; }
.map-legend span { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
.map-legend .lg-diamond {
  width: 7px; height: 7px; border-radius: 1px; transform: rotate(45deg);
  background: #8b95a5; margin-right: 6px; margin-left: 1px;
}
.map-legend .lg-sq {
  width: 7px; height: 7px; border-radius: 1px; background: #8b95a5;
}
.map-legend .lg-ring {
  width: 8px; height: 8px; border-radius: 50%; background: transparent;
  border: 1.5px dashed rgba(125, 211, 252, .85); box-sizing: border-box;
}
.map-legend .lg-box {
  width: 10px; height: 8px; border-radius: 1px; background: transparent;
  border: 1.5px dashed rgba(78, 196, 224, .95); box-sizing: border-box;
  vertical-align: middle; margin-right: 4px;
}
.uncert-label {
  background: transparent !important; border: none !important;
  font: 10px/1.2 var(--mono, ui-monospace, Consolas, monospace);
  color: var(--cyan); text-shadow: 0 0 4px rgba(0,0,0,.9), 0 1px 2px rgba(0,0,0,.8);
  white-space: nowrap; pointer-events: none;
}
.uncert-label span {
  display: inline-block; padding: 2px 5px; border-radius: 4px;
  background: rgba(8,12,18,.82); border: 1px solid rgba(78,196,224,.45);
}
.uncert-label.amber span {
  color: var(--amber); border-color: rgba(255,200,87,.4);
}
/* Context underlay: dive diamonds (fish use canvas circleMarkers) */
.ctx-marker { background: transparent !important; border: none !important; }
.ctx-dive-diamond {
  width: 7px; height: 7px;
  background: rgba(140, 150, 165, 0.55);
  border: 1px solid rgba(100, 110, 125, 0.75);
  transform: rotate(45deg);
  box-sizing: border-box;
}
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; grid-template-rows: 32vh 1fr; height: auto; min-height: calc(100vh - var(--hdr, 70px)); }
  aside { max-height: 32vh; border-right: none; border-bottom: 1px solid var(--line); }
  #map { min-height: 40vh; }
  .panel { position: static; width: auto; margin: 8px; max-height: none; }
  .map-wrap { display: flex; flex-direction: column; }
  .map-legend { position: static; margin: 0 8px 8px; }
}
</style>
</head>
<body>
<header id="hdr">
  <h1>Pin Trust Review</h1>
  <div class="stats" id="stats">Loading…</div>
  <div class="hdr-actions">
    <button type="button" id="btnHardRefresh" title="Clears cached app files and reloads (keeps your yes/no/unsure answers and groups)">Hard refresh</button>
  </div>
</header>
<div class="layout">
  <aside>
    <div class="toolbar">
      <select id="filterPri" title="Priority">
        <option value="all">All priorities</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
        <option value="pending" selected>Unreviewed</option>
        <option value="done">Reviewed</option>
      </select>
      <select id="filterKind">
        <option value="all">Fish + dive</option>
        <option value="fish">Fish only</option>
        <option value="dive">Dive only</option>
      </select>
      <input type="search" id="search" placeholder="Search…">
    </div>
    <div class="list" id="list"></div>
  </aside>
  <div class="map-wrap">
    <div id="map"></div>
    <div class="map-legend" id="mapLegend" hidden>
      <div class="lg-title">Nearby context</div>
      <div><span style="background:#ff6b4a"></span>Focus (review candidate)</div>
      <div><span style="background:#ffc857"></span>Nearby candidate</div>
      <div><span style="background:#7dd3fc"></span>Nearby live pin</div>
      <div><span style="background:#c4b5fd"></span>In group selection</div>
      <div><span class="lg-ring"></span>Nearby search radius</div>
      <div><span class="lg-box"></span>Position uncertainty (focus)</div>
      <div><span class="lg-sq" style="border-radius:50%;background:#8b95a5"></span>All fish (context)</div>
      <div><span class="lg-diamond"></span>All dive (context)</div>
      <div class="lg-meta" id="mapLegendUncert" hidden></div>
      <div class="lg-meta" id="mapLegendMeta">BlueTopo / NCEI DEM · local fit</div>
    </div>
    <div class="panel" id="panel">
      <div class="hint">Select a candidate from the list.</div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="pin-trust-review-data.js"></script>
<script src="pin-feature-groups-data.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="seafloor-render.js?v=13"></script>
<script>
(function () {
  'use strict';
  var DATA = window.PIN_TRUST_REVIEW;
  if (!DATA || !DATA.candidates) {
    document.getElementById('stats').textContent = 'Missing pin-trust-review-data.js — run: cscript //Nologo build-pin-trust-review.js';
    return;
  }

  var STORAGE_KEY = 'pinTrustReviewResults_v1';
  var GROUPS_KEY = 'pinFeatureGroups_v1';
  var DUAL_UNLINK_KEY = 'pinTrustReviewDualUnlink_v1';
  var SR = window.SeafloorRender || null;
  /* Local review view — structure-scale (~1944 ft), not the app’s 10 nmi On site fit. */
  var REVIEW_FIT_NM = 0.32; /* ~1944 ft */
  var REVIEW_FIT_MAX_ZOOM = 17;
  /* Exact-or-tiny float epsilon for “same physical coords” fish+dive duals (Franko pairs). */
  var DUAL_COORD_EPS = 1e-9;
  var results = {};
  var featureGroups = [];
  var groupSel = {}; /* pinKey -> pin snapshot */
  var dualOf = {}; /* candidateId -> twin candidate object */
  var dualUnlinked = {}; /* candidateId -> true when user split joint review */
  /* Default 0.5 nm — enough for duplicates/clusters without bay clutter. */
  var nearbyRadiusNm = 0.5;
  var editingGroupId = null;
  var basemapReady = false;
  var basemapLabel = 'BlueTopo relief';

  function seedFromPrior() {
    var prior = DATA.priorResults || [];
    prior.forEach(function (r) {
      if (r && r.id && r.verdict && r.verdict !== 'pending') results[r.id] = r;
    });
    /* Build also stamps priorVerdict on matched candidates — seed if priorResults missed an id */
    (DATA.candidates || []).forEach(function (c) {
      if (!c || !c.id || !c.priorVerdict || c.priorVerdict === 'pending') return;
      if (results[c.id] && results[c.id].verdict) return;
      results[c.id] = {
        id: c.id, kind: c.kind, name: c.name, lat: c.lat, lon: c.lon,
        priority: c.priority, trustClass: c.trustClass, currentlyDisplayed: c.currentlyDisplayed,
        source: c.source, verdict: c.priorVerdict, note: c.priorNote || '',
        reviewedAt: c.reviewedAt || ''
      };
    });
  }
  seedFromPrior();

  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var stored = JSON.parse(raw);
      var local = stored.results || {};
      var priorAt = DATA.priorExportedAt ? Date.parse(DATA.priorExportedAt) : 0;
      var localAt = stored.savedAt ? Date.parse(stored.savedAt) : 0;
      if (!priorAt || (localAt && localAt >= priorAt)) {
        Object.keys(local).forEach(function (id) {
          if (local[id] && local[id].verdict) results[id] = local[id];
        });
      }
    }
  } catch (e) { /* keep seeded prior */ }

  function seedGroups() {
    featureGroups = [];
    var bundled = DATA.featureGroups || [];
    var fileGroups = (window.PIN_FEATURE_GROUPS && window.PIN_FEATURE_GROUPS.groups) || [];
    var src = bundled.length ? bundled : fileGroups;
    src.forEach(function (g) {
      if (g && g.groupId) featureGroups.push(JSON.parse(JSON.stringify(g)));
    });
    try {
      var grow = localStorage.getItem(GROUPS_KEY);
      if (grow) {
        var gs = JSON.parse(grow);
        var bundledAt = DATA.featureGroupsExportedAt ? Date.parse(DATA.featureGroupsExportedAt) : 0;
        var fileAt = window.PIN_FEATURE_GROUPS && window.PIN_FEATURE_GROUPS.exportedAt
          ? Date.parse(window.PIN_FEATURE_GROUPS.exportedAt) : 0;
        var baseAt = Math.max(bundledAt || 0, fileAt || 0);
        var localAt = gs.savedAt ? Date.parse(gs.savedAt) : 0;
        if (!baseAt || (localAt && localAt >= baseAt)) {
          if (gs.groups && gs.groups.length) {
            featureGroups = gs.groups.map(function (g) { return JSON.parse(JSON.stringify(g)); });
          }
        }
      }
    } catch (e2) { /* keep bundled */ }
  }
  seedGroups();

  /*
   * Fish+dive duals: same physical coords (exact / tiny eps), esp. same-source Franko stems.
   * One map review covers both ids; export still writes per-id verdicts.
   */
  function coordsEqualDual(a, b) {
    if (!a || !b || a.lat == null || b.lat == null || a.lon == null || b.lon == null) return false;
    return Math.abs(Number(a.lat) - Number(b.lat)) <= DUAL_COORD_EPS &&
      Math.abs(Number(a.lon) - Number(b.lon)) <= DUAL_COORD_EPS;
  }

  function frankoStem(id) {
    var m = String(id || '').match(/^franko_(.+)_(dive|fish)$/i);
    return m ? m[1].toLowerCase() : null;
  }

  function dualCoordKey(c) {
    return Number(c.lat).toFixed(9) + ',' + Number(c.lon).toFixed(9);
  }

  function sameSourceHint(a, b) {
    if (!a || !b) return false;
    if (a.source && b.source && a.source === b.source) return true;
    var sa = frankoStem(a.id), sb = frankoStem(b.id);
    if (sa && sb && sa === sb) return true;
    var ra = String(a.reason || ''), rb = String(b.reason || '');
    if (/Fish dual|same coords as dive/i.test(ra) || /Fish dual|same coords as dive/i.test(rb)) return true;
    return false;
  }

  function linkDualPair(a, b) {
    if (!a || !b || a.id === b.id || dualOf[a.id] || dualOf[b.id]) return;
    if (a.kind === b.kind) return;
    if (!coordsEqualDual(a, b)) return;
    dualOf[a.id] = b;
    dualOf[b.id] = a;
  }

  function buildDualIndex() {
    dualOf = {};
    var cands = DATA.candidates || [];
    var byStem = {};
    cands.forEach(function (c) {
      var stem = frankoStem(c.id);
      if (!stem) return;
      if (!byStem[stem]) byStem[stem] = {};
      byStem[stem][c.kind] = c;
    });
    Object.keys(byStem).forEach(function (stem) {
      var d = byStem[stem].dive;
      var f = byStem[stem].fish;
      if (d && f) linkDualPair(d, f);
    });
    var byCoord = {};
    cands.forEach(function (c) {
      if (!c || c.lat == null || dualOf[c.id]) return;
      var k = dualCoordKey(c);
      if (!byCoord[k]) byCoord[k] = [];
      byCoord[k].push(c);
    });

  function haversineNm(lat1, lon1, lat2, lon2) {
    var R = 3440.065, dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  /*
   * Position-uncertainty half-width from stated/source coordinate precision.
   * Visualization only — never nudge stored lat/lon.
   *
   * Mapping (half-width ≈ last significant digit of the stated value):
   *   decimal degrees:
   *     1 dp → ~1e-1°  (~6 nm / ~36,000 ft)
   *     2 dp → ~1e-2°  (~0.6 nm / ~3,600 ft)
   *     3 dp → ~1e-3°  (~360 ft)
   *     4 dp → ~1e-4°  (~36 ft)
   *     5 dp → ~1e-5°  (~3.6 ft)
   *   DMS decimal-minutes (DM.m…):
   *     0.1′   → 0.1/60°   (~600 ft)
   *     0.01′  → 0.01/60°  (~60 ft)
   *     0.001′ → 0.001/60° (~6 ft)
   *   DMS seconds:
   *     1″ → 1/3600° (~101 ft); 0.1″ → ~10 ft
   * Prefer sourceDetail / coordText / explicit precision over float digit inference
   * (Franko often stores full float from DMS conversion).
   */
  var FT_PER_DEG_LAT = 364000; /* ≈ 60 nm × 6076 ft */
  var UNCERT_HALF_MIN = 5e-6;  /* ~1.8 ft — avoid zero-size boxes */
  var UNCERT_HALF_MAX = 0.15;  /* cap huge boxes (~9 nm) */

  function degHalfToFt(halfDeg, lat) {
    /* Report lat-axis feet (readable scale); lon half-width shrinks with cos(lat) in the box. */
    return halfDeg * FT_PER_DEG_LAT;
  }

  function clampHalf(h) {
    if (!isFinite(h) || h <= 0) return UNCERT_HALF_MIN;
    return Math.min(UNCERT_HALF_MAX, Math.max(UNCERT_HALF_MIN, h));
  }

  function fmtFt(ft) {
    if (ft >= 5280) return (ft / 5280).toFixed(ft >= 52800 ? 0 : 1) + ' mi';
    if (ft >= 1000) return Math.round(ft).toLocaleString() + ' ft';
    if (ft >= 100) return Math.round(ft) + ' ft';
    if (ft >= 10) return (Math.round(ft * 10) / 10) + ' ft';
    return (Math.round(ft * 10) / 10) + ' ft';
  }

  function fracDigitsFromMatch(frac) {
    if (frac == null || frac === '') return 0;
    return String(frac).length;
  }

  /** Infer meaningful decimal places from a stored float (round / DMS-residue aware). */
  function inferFloatDecimalPlaces(n) {
    if (!isFinite(n)) return 5;
    var abs = Math.abs(n);
    var whole = Math.floor(abs);
    var frac = abs - whole;
    if (frac < 1e-12) return 0;

    /* Prefer the coarsest k where n is essentially a k-dp round number. */
    var k;
    for (k = 0; k <= 7; k++) {
      var scale = Math.pow(10, k);
      var rounded = Math.round(abs * scale) / scale;
      if (Math.abs(abs - rounded) < 1e-9 + 5e-12 * scale) {
        /* Reject pure float noise that only matches at very fine k when coarser also fits
         * after stripping classic DMS conversion tails (…3333 / …6666). */
        return k;
      }
    }

    /* Long tails from minutes/60 (e.g. 33.48458333333333 ← 29.075′). */
    var s = abs.toFixed(12).replace(/0+$/, '');
    var m = s.match(/\.(\d+?)(?:(\d)\2{3,}|$)/);
    if (m) {
      var digs = m[1];
      /* If remainder looks like repeating 3/6 after a short stem, stem length is source dp. */
      var stem = digs.replace(/([36])\1+$/, '');
      if (stem.length >= 1 && stem.length <= 7 && stem.length < digs.length) return stem.length;
      return Math.min(7, digs.length);
    }
    return 5;
  }

  function halfFromDecimalPlaces(dp) {
    dp = Math.max(0, Math.min(7, dp | 0));
    return clampHalf(Math.pow(10, -dp));
  }

  function halfFromMinuteDecimals(dp) {
    dp = Math.max(0, Math.min(5, dp | 0));
    return clampHalf(Math.pow(10, -dp) / 60);
  }

  function halfFromSecondDecimals(dp) {
    dp = Math.max(0, Math.min(3, dp | 0));
    return clampHalf(Math.pow(10, -dp) / 3600);
  }

  function polishDmLabel(mdp) {
    if (mdp <= 0) return "1'";
    return '0.' + (mdp === 1 ? '1' : new Array(mdp).join('0') + '1') + '′';
  }

  /**
   * Parse one coordinate token from source text → { halfDeg, label, kind }.
   * Supports DM.mmm, D°M'S", and decimal degrees (with or without °).
   */
  function parseOneCoordToken(raw) {
    if (!raw) return null;
    var t = String(raw).replace(/\u2032/g, "'").replace(/\u2033/g, '"')
      .replace(/\u2019/g, "'").replace(/\u00B0/g, '°').trim();

    /* D°M'S.s" — require minutes mark so D°M.mmm′ is not misread as seconds. */
    var dms = t.match(/(-?\d+)\s*°\s*(\d+)\s*['′]\s*(\d+(?:\.\d+)?)\s*["″]?/);
    if (dms) {
      var secFrac = dms[3].indexOf('.') >= 0 ? dms[3].split('.')[1] : '';
      var sdp = fracDigitsFromMatch(secFrac);
      return {
        halfDeg: halfFromSecondDecimals(sdp),
        label: sdp > 0 ? (sdp + ' dp sec') : '1″',
        kind: 'dms-sec'
      };
    }

    /* D°M.mmm′  (Franko / diver.net / USC DM) */
    var dm = t.match(/(-?\d+)\s*°\s*(\d+)(?:\.(\d+))?\s*['′]?/);
    if (dm) {
      var mdp = fracDigitsFromMatch(dm[3]);
      return {
        halfDeg: halfFromMinuteDecimals(mdp),
        label: polishDmLabel(mdp),
        kind: 'dm'
      };
    }

    /* Plain or °-suffixed decimal degrees */
    var dec = t.match(/(-?\d+)\.(\d+)\s*°?/);
    if (dec) {
      var ddp = fracDigitsFromMatch(dec[2].replace(/0+$/, '') || '0');
      /* Keep stated trailing zeros when source wrote them (e.g. 33.4514 / -118.4870). */
      var stated = fracDigitsFromMatch(dec[2]);
      var use = /0$/.test(dec[2]) ? stated : (ddp || stated);
      return {
        halfDeg: halfFromDecimalPlaces(use),
        label: use + ' dp',
        kind: 'decimal'
      };
    }

    var whole = t.match(/(-?\d+)\s*°?\s*$/);
    if (whole) {
      return { halfDeg: halfFromDecimalPlaces(0), label: '0 dp', kind: 'decimal' };
    }
    return null;
  }

  function parseSourceCoordPrecision(text) {
    if (!text || /not verified|verbatim|default-trusted|already live|excluded from live/i.test(text)) {
      return null;
    }
    var s = String(text).replace(/\u2032/g, "'").replace(/\u2033/g, '"')
      .replace(/\u2019/g, "'").replace(/\u00B0/g, '°');

    /* Prefer the DMS/DM portion before "→ decimal …" (Franko sourceDetail). */
    var head = s.split(/\u2192|->|→/)[0];

    var tokens = [];
    var reDms = /(-?\d+\s*°\s*\d+\s*['′]\s*\d+(?:\.\d+)?\s*["″]?)/g;
    var reDm = /(-?\d+\s*°\s*\d+(?:\.\d+)?\s*['′]?)/g;
    var reDecDeg = /(-?\d+\.\d+)\s*°/g;
    var rePlainPair = /(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/;
    var m;

    /* DMS first (requires minutes mark + seconds). DM.mmm′ won't match that shape. */
    while ((m = reDms.exec(head))) tokens.push(parseOneCoordToken(m[1]));
    if (!tokens.length) {
      while ((m = reDm.exec(head))) tokens.push(parseOneCoordToken(m[1]));
    }
    if (!tokens.length) {
      while ((m = reDecDeg.exec(head))) tokens.push(parseOneCoordToken(m[1] + '°'));
    }
    if (!tokens.length) {
      m = rePlainPair.exec(head);
      if (m) {
        tokens.push(parseOneCoordToken(m[1]));
        tokens.push(parseOneCoordToken(m[2]));
      }
    }

    tokens = tokens.filter(Boolean);
    if (!tokens.length) return null;

    var halfLat = tokens[0].halfDeg;
    var halfLon = tokens.length > 1 ? tokens[1].halfDeg : tokens[0].halfDeg;
    var label = tokens[0].label;
    if (tokens[0].kind === 'dm') {
      var md = 0;
      var mm = head.match(/°\s*\d+\.(\d+)/);
      if (mm) md = mm[1].length;
      label = polishDmLabel(md);
    }
    return {
      halfDegLat: halfLat,
      halfDegLon: halfLon,
      label: label,
      source: 'stated'
    };
  }

  function precisionFromExplicit(p) {
    var meta = p.coordPrecision || p.precision;
    if (!meta) return null;
    if (typeof meta === 'number' && isFinite(meta) && meta > 0) {
      return {
        halfDegLat: clampHalf(meta),
        halfDegLon: clampHalf(meta),
        label: 'meta',
        source: 'meta'
      };
    }
    if (typeof meta === 'object') {
      var hLat = meta.halfDegLat != null ? meta.halfDegLat
        : (meta.halfDeg != null ? meta.halfDeg
          : (meta.decimalPlaces != null ? halfFromDecimalPlaces(meta.decimalPlaces)
            : (meta.minuteDecimals != null ? halfFromMinuteDecimals(meta.minuteDecimals) : null)));
      var hLon = meta.halfDegLon != null ? meta.halfDegLon : hLat;
      if (hLat == null) return null;
      return {
        halfDegLat: clampHalf(hLat),
        halfDegLon: clampHalf(hLon != null ? hLon : hLat),
        label: meta.label || (meta.minuteDecimals != null ? polishDmLabel(meta.minuteDecimals)
          : (meta.decimalPlaces != null ? meta.decimalPlaces + ' dp' : 'meta')),
        source: 'meta'
      };
    }
    return null;
  }

  function resolvePinPrecision(p) {
    if (!p) return null;
    var ex = precisionFromExplicit(p);
    if (ex) return ex;

    var text = p.coordText || p.sourceDetail || '';
    var fromText = parseSourceCoordPrecision(text);
    if (fromText) return fromText;

    /* Float fallback: independent axes; watch for DMS-conversion residue. */
    var dpLat = inferFloatDecimalPlaces(Number(p.lat));
    var dpLon = inferFloatDecimalPlaces(Number(p.lon));
    return {
      halfDegLat: halfFromDecimalPlaces(dpLat),
      halfDegLon: halfFromDecimalPlaces(dpLon),
      label: Math.min(dpLat, dpLon) + ' dp',
      source: 'float'

  }

  function matchesFilter(c) {

  /*
   * List / Next / Next-unreviewed order: Morton (Z-order) on lat/lon so nearby
   * coastal sites cluster together (better for map review than A–Z or priority).
   * Y axis is inverted (N→S); X is W→E. Dual fish+dive rows share coords → one key.
   */
  var _geoBounds = null;
  function geoBounds() {
    if (_geoBounds) return _geoBounds;
    var minLat = 90, maxLat = -90, minLon = 180, maxLon = -180;
    (DATA.candidates || []).forEach(function (c) {
      if (c.lat == null || c.lon == null) return;
      var la = Number(c.lat), lo = Number(c.lon);
      if (la < minLat) minLat = la;
      if (la > maxLat) maxLat = la;
      if (lo < minLon) minLon = lo;
      if (lo > maxLon) maxLon = lo;
    });
    if (!(minLat < maxLat)) { minLat -= 0.01; maxLat += 0.01; }
    if (!(minLon < maxLon)) { minLon -= 0.01; maxLon += 0.01; }
    _geoBounds = { minLat: minLat, maxLat: maxLat, minLon: minLon, maxLon: maxLon };
    return _geoBounds;
  }

  function mortonPart16(n) {
    n &= 0xffff;
    n = (n | (n << 8)) & 0x00ff00ff;
    n = (n | (n << 4)) & 0x0f0f0f0f;
    n = (n | (n << 2)) & 0x33333333;
    n = (n | (n << 1)) & 0x55555555;
    return n;
  }

  function geoMortonKey(c) {
    var b = geoBounds();
    var lat = Number(c.lat), lon = Number(c.lon);
    /* Quantize into 16-bit grid; N→S (high lat → low y) then W→E via bit interleave. */
    var y = Math.max(0, Math.min(0xffff,
      Math.floor((b.maxLat - lat) / (b.maxLat - b.minLat) * 0xffff)));
    var x = Math.max(0, Math.min(0xffff,
      Math.floor((lon - b.minLon) / (b.maxLon - b.minLon) * 0xffff)));
    return (mortonPart16(x) | (mortonPart16(y) << 1)) >>> 0;
  }

  function compareGeo(a, b) {
    var ka = geoMortonKey(a), kb = geoMortonKey(b);
    if (ka !== kb) return ka < kb ? -1 : 1;
    if (a.id < b.id) return -1;
    if (a.id > b.id) return 1;
    return 0;
  }

  function renderList() {
    filtered = DATA.candidates.filter(matchesFilter).filter(function (c) {
      return dualListRep(c).id === c.id;
    });
    filtered.sort(compareGeo);
    var list = document.getElementById('list');
    list.innerHTML = '';
    filtered.forEach(function (c) {
      var twin = getDualTwin(c);
      var v = verdictOf(c.id);
      if (twin) {
        var tv = verdictOf(twin.id);
        /* Show worst/pending if split state somehow differs */
        if (v === 'pending' && tv !== 'pending') v = tv;
        else if (v !== 'pending' && tv === 'pending') { /* keep v */ }
        else if (v !== tv && tv !== 'pending') v = v; /* focus id wins for badge */
      }
      var k = pinKey(c);
      var div = document.createElement('div');
      div.className = 'item' + (c.id === activeId || (twin && twin.id === activeId) ? ' active' : '') +

  /** Universe for nearby: review candidates + live map pins (deduped by kind+coords). */
  function allPinsUniverse() {
    var out = [];
    var seen = {};
    function add(p, isCandidate) {
      if (!p || p.lat == null || p.lon == null) return;
      var k = pinKey(p);
      if (seen[k]) {
        if (isCandidate && p.id) seen[k].candidateId = p.id;
        if (isCandidate) seen[k].isCandidate = true;
        if (p.currentlyDisplayed) seen[k].currentlyDisplayed = true;
        if (p.trustClass && (!seen[k].trustClass || seen[k].trustClass === 'other')) seen[k].trustClass = p.trustClass;
        if (p.diveId) seen[k].diveId = p.diveId;
        return;
      }
      var row = {
        key: k,
        id: p.id || null,
        candidateId: isCandidate ? p.id : null,
        kind: p.kind,
        name: p.name,
        lat: p.lat,
        lon: p.lon,
        trustClass: p.trustClass || 'other',
        currentlyDisplayed: !!p.currentlyDisplayed,
        isCandidate: !!isCandidate,
        diveId: p.diveId || '',
        priority: p.priority || ''
      };
      seen[k] = row;
      out.push(row);
    }
    (DATA.candidates || []).forEach(function (c) { add(c, true); });
    (DATA.livePins || []).forEach(function (p) { add(p, false); });
    return out;
  }

  function findNearby(focus) {
    if (!focus) return [];
    var univ = allPinsUniverse();
    var twin = getDualTwin(focus);
    var twinKey = twin ? pinKey(twin) : null;
    var rows = [];
    univ.forEach(function (p) {
      if (p.key === pinKey(focus)) return;
      if (twinKey && p.key === twinKey) return; /* same physical mark — joint dual */
      var d = haversineNm(focus.lat, focus.lon, p.lat, p.lon);
      if (d <= nearbyRadiusNm) {
        rows.push({ pin: p, distNm: d });
      }
    });
    rows.sort(function (a, b) { return a.distNm - b.distNm; });
    return rows;
  }

  function toggleSelPin(p) {
    var k = pinKey(p);
    if (groupSel[k]) delete groupSel[k];
    else {
      groupSel[k] = {
        id: p.candidateId || p.id || ('coord_' + k),
        kind: p.kind,
        name: p.name,
        lat: p.lat,
        lon: p.lon,
        diveId: p.diveId || '',
        trustClass: p.trustClass || ''
      };
    }
    if (activeId) {
      var c = DATA.candidates.find(function (x) { return x.id === activeId; });
      if (c) { showPanel(c); drawFocus(c); }
    }
    renderList();
  }

    if (activeId) {

      if (c) {
        var fk = pinKey(c);

      }

  function slugify(s) {
    return String(s || 'group').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 48) || 'group';
  }

  function saveCurrentGroup() {
    var nameEl = document.getElementById('groupNameBox');
    var displayName = (nameEl && nameEl.value || '').trim();
    var members = Object.keys(groupSel).map(function (k) { return groupSel[k]; });
    if (members.length < 2) {
      toast('Select at least 2 pins for a feature group');
      return;
    }
    if (!displayName) {
      toast('Enter a feature group name');
      return;
    }
    var groupId = editingGroupId || ('pfg_' + slugify(displayName) + '_' + Date.now().toString(36).slice(-4));
    var existing = featureGroups.findIndex(function (g) { return g.groupId === groupId; });
    var row = {
      groupId: groupId,
      displayName: displayName,
      members: members.map(function (m) {
        return {
          id: m.id,
          kind: m.kind,
          name: m.name,
          lat: m.lat,
          lon: m.lon,
          diveId: m.diveId || ''
        };
      }),
      updatedAt: new Date().toISOString()
    };
    if (existing >= 0) featureGroups[existing] = row;
    else featureGroups.push(row);
    editingGroupId = groupId;
    saveGroups();
    toast('Saved group "' + displayName + '" (' + members.length + ' modules)');

    groupSel = {};

    (g.members || []).forEach(function (m) {
      groupSel[pinKey(m)] = {
        id: m.id || ('coord_' + pinKey(m)),

        name: m.name,

  function groupContaining(c) {
    var k = pinKey(c);
    for (var i = 0; i < featureGroups.length; i++) {
      var g = featureGroups[i];
      var mems = g.members || [];
      for (var j = 0; j < mems.length; j++) {
        if (pinKey(mems[j]) === k) return g;
        if (haversineNm(c.lat, c.lon, mems[j].lat, mems[j].lon) <= 0.05) return g;
      }

    return null;
  }

    var hrPanel = document.getElementById('btnHardRefreshPanel');
    if (hrPanel) hrPanel.onclick = function () { hardRefreshReview(hrPanel); };
    document.getElementById('importFile').onchange = importFile;
    document.querySelector('.export-row label').onclick = function () {
      document.getElementById('importFile').click();
    };
    document.getElementById('nearRadius').onchange = function () {
      nearbyRadiusNm = parseFloat(this.value) || 1;
      showPanel(c);
      drawFocus(c);
    };
    document.getElementById('btnAddNearby').onclick = addNearbyToSel;
    document.getElementById('btnToggleFocus').onclick = function () { addFocusToSel(c); };
    document.getElementById('btnSaveGroup').onclick = saveCurrentGroup;
    document.getElementById('btnClearSel').onclick = clearSel;
    var delBtn = document.getElementById('btnDeleteGroup');
    if (delBtn) delBtn.onclick = function () { deleteGroup(editingGroupId); };
    var unlinkBtn = document.getElementById('btnUnlinkDual');
    if (unlinkBtn) unlinkBtn.onclick = function () { unlinkDual(c); };
    var relinkBtn = document.getElementById('btnRelinkDual');
    if (relinkBtn) relinkBtn.onclick = function () { relinkDual(c); };

    Array.prototype.forEach.call(document.querySelectorAll('#nearList .near-row'), function (rowEl, idx) {
      var row = nearby[idx];
      if (!row) return;
      var p = row.pin;
      rowEl.querySelector('.t').textContent = p.name;
      rowEl.querySelector('.m').textContent =
        row.distNm.toFixed(2) + ' nm · ' + p.kind + ' · ' + (p.trustClass || '?') +
        ' · ' + (p.currentlyDisplayed ? 'on map' : 'off map') +
        (p.isCandidate ? ' · review candidate' : ' · live only') +
        ' · ' + Number(p.lat).toFixed(5) + ', ' + Number(p.lon).toFixed(5);
      rowEl.onclick = function () {
        if (p.candidateId) {
          /* Shift-click or long path: select candidate; default toggle group sel + pan */
          if (window.event && window.event.shiftKey) {
            selectCand(p.candidateId);
            return;
          }
        }
        toggleSelPin(p);
        /* Also briefly highlight on map — already redrawn */
      };
      rowEl.ondblclick = function () {
        if (p.candidateId) selectCand(p.candidateId);
      };
    });

    Array.prototype.forEach.call(document.querySelectorAll('#groupsList .grp-row'), function (rowEl, gi) {
      var g = featureGroups[gi];
      if (!g) return;
      rowEl.querySelector('.t').textContent = g.displayName;
      rowEl.querySelector('.m').textContent = (g.members || []).length + ' modules · ' + g.groupId + ' · tap=edit · hold/right-click=delete';
      rowEl.onclick = function () { loadGroupIntoSel(g.groupId); };
      var touchTimer = null;
      rowEl.addEventListener('touchstart', function () {
        touchTimer = setTimeout(function () { deleteGroup(g.groupId); }, 700);
      }, { passive: true });
      rowEl.addEventListener('touchend', function () { if (touchTimer) clearTimeout(touchTimer); });
      rowEl.addEventListener('touchmove', function () { if (touchTimer) clearTimeout(touchTimer); });
      rowEl.oncontextmenu = function (ev) {
        ev.preventDefault();
        deleteGroup(g.groupId);
      };
    });
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function escAttr(s) { return esc(s).replace(/"/g, '&quot;'); }

  function drawFocus(c) {
    pinLayer.clearLayers();
    document.getElementById('mapLegend').hidden = false;
    var nearby = findNearby(c);
    lastNearby = nearby;
    var meta = document.getElementById('mapLegendMeta');
    if (meta) {
      meta.textContent = basemapLabel + ' · ' + nearby.length + ' nearby ≤' + nearbyRadiusNm +
        ' nm · view ~' + Math.round(REVIEW_FIT_NM * ((SR && SR.FT_PER_NM) || 6076)) + ' ft';
    }

    /* Search radius ring — helps judge cluster vs distinct marks at the selected nearby radius. */
    var radiusM = nearbyRadiusNm * 1852;
    L.circle([c.lat, c.lon], {
      radius: radiusM,
      color: '#7dd3fc',
      weight: 1.5,
      dashArray: '5 6',
      fillColor: '#7dd3fc',
      fillOpacity: 0.04,
      interactive: false
    }).addTo(pinLayer);

    /* Tighter fit ring (On site–scale) so relief detail stays readable. */
    L.circle([c.lat, c.lon], {
      radius: REVIEW_FIT_NM * 1852,
      color: 'rgba(255,107,74,.45)',
      weight: 1,
      dashArray: '2 4',
      fill: false,
      interactive: false
    }).addTo(pinLayer);

    /* Lat/lon-aligned uncertainty boxes for close nearby candidates (cheap; no labels). */
    nearby.forEach(function (row) {
      if (row.distNm > REVIEW_FIT_NM) return;
      if (!row.pin || !row.pin.isCandidate) return;
      drawUncertaintyBox(row.pin, {
        color: '#ffc857',
        weight: 1,
        fillOpacity: 0.03,
        opacity: 0.7,
        withLabel: false
      });
    });

    nearby.forEach(function (row) {
      var p = row.pin;
      var inSel = !!groupSel[p.key];
      var color = inSel ? '#c4b5fd' : (p.isCandidate ? '#ffc857' : '#7dd3fc');
      var close = row.distNm <= REVIEW_FIT_NM;
      var m = L.circleMarker([p.lat, p.lon], {
        radius: inSel ? 9 : (close ? 7 : 6),
        color: '#fff',
        fillColor: color,
        fillOpacity: 0.95,
        weight: close ? 2 : 1.5,
        zIndexOffset: close ? 400 : 200
      }).bindPopup(
        '<b>' + esc(p.name) + '</b><br>' +
        row.distNm.toFixed(2) + ' nm · ' + p.kind +
        (p.isCandidate ? ' · review candidate' : ' · live') + '<br>' +
        Number(p.lat).toFixed(6) + ', ' + Number(p.lon).toFixed(6)
      ).addTo(pinLayer);
      m.on('click', function () { toggleSelPin(p); });
    });

    Object.keys(groupSel).forEach(function (k) {
      var m = groupSel[k];
      if (pinKey(c) === k) return;
      if (nearby.some(function (r) { return r.pin.key === k; })) return;
      L.circleMarker([m.lat, m.lon], {
        radius: 7, color: '#fff', fillColor: '#c4b5fd', fillOpacity: 0.85, weight: 1.5
      }).bindPopup(esc(m.name) + ' (selected)').addTo(pinLayer);
    });

    /* Focus uncertainty box + one-line label (cyan dashed, lat/lon aligned). */
    var focusPrec = drawUncertaintyBox(c, {
      color: '#4ec4e0',
      weight: 1.75,
      fillOpacity: 0.07,
      withLabel: true
    });
    var uncertMeta = document.getElementById('mapLegendUncert');
    if (uncertMeta) {
      if (focusPrec) {
        uncertMeta.hidden = false;
        uncertMeta.textContent = 'Focus unc. ' + precisionLegendText(focusPrec, c.lat) +
          (focusPrec.source === 'stated' ? ' · from source text'
            : (focusPrec.source === 'meta' ? ' · from metadata' : ' · inferred from float'));
      } else {
        uncertMeta.hidden = true;
        uncertMeta.textContent = '';
      }
    }

    L.circleMarker([c.lat, c.lon], {
      radius: 11, color: '#fff', fillColor: '#ff6b4a', fillOpacity: 0.98, weight: 2.5
    }).bindPopup('<b>' + esc(getDualTwin(c) ? dualSiteLabel(c, getDualTwin(c)) : c.name) + '</b><br>Focus · ' +
      (getDualTwin(c) ? 'fish+dive dual' : c.kind) +
      (focusPrec ? '<br>' + precisionLegendText(focusPrec, c.lat) : '')
    ).addTo(pinLayer);

    /* Local fit: at least On site–near (~0.32 nm), expand to nearby radius up to ~0.55 nm
     * so the search ring stays in view — never fit to 1–2 nm (bay-wide clutter). */
    var fitNm = Math.max(REVIEW_FIT_NM, Math.min(nearbyRadiusNm, 0.55));
    if (SR && typeof SR.fitLocalView === 'function') {
      SR.fitLocalView(map, c.lat, c.lon, fitNm, REVIEW_FIT_MAX_ZOOM);
    } else {
      var dLat = fitNm / 60;
      var dLon = fitNm / Math.max(0.2, 60 * Math.cos(c.lat * Math.PI / 180));
      try {
        map.fitBounds([[c.lat - dLat, c.lon - dLon], [c.lat + dLat, c.lon + dLon]], {
          padding: [28, 28], maxZoom: REVIEW_FIT_MAX_ZOOM, animate: false
        });
      } catch (e) {
        map.setView([c.lat, c.lon], Math.max(map.getZoom(), 15));
      }
    }
  }

  function selectCand(id) {
    var c = DATA.candidates.find(function (x) { return x.id === id; });
    if (!c) return;
    /* Prefer list representative so fish twin of a dual opens the joint dive row */
    var kindFilter = document.getElementById('filterKind').value;
    if (kindFilter === 'all' && getDualTwin(c)) c = dualListRep(c);
    activeId = c.id;
    showPanel(c);
    drawFocus(c);
    renderList();
  }

  function step(dir) {
    if (!filtered.length) return;
    var idx = filtered.findIndex(function (c) { return c.id === activeId; });
    if (idx < 0) idx = 0;
    else idx = (idx + dir + filtered.length) % filtered.length;
    selectCand(filtered[idx].id);
  }

  function nextPending() {
    var start = filtered.findIndex(function (c) {
      return c.id === activeId || (getDualTwin(c) && getDualTwin(c).id === activeId);
    });
    for (var i = 1; i <= filtered.length; i++) {
      var c = filtered[(Math.max(start, 0) + i) % filtered.length];
      if (verdictOf(c.id) === 'pending') {
        var twin = getDualTwin(c);
        /* Twin already decided (joint or prior) — treat this dual as covered */
        if (twin && verdictOf(twin.id) !== 'pending') continue;
        selectCand(c.id);
        return;
      }
      /* Also skip when focus id pending but twin covered — already handled above */
    }
    var allPending = 0;
    DATA.candidates.forEach(function (c) {
      if (verdictOf(c.id) === 'pending') allPending++;
    });
    if (allPending === 0) {
      toast('Queue fully reviewed — live map pins are not auto-queued. Rebuild after new adds: cscript //Nologo build-pin-trust-review.js');
    } else {
      toast('No unreviewed items in this filter (' + allPending + ' pending outside filter)');
    }
  }

  function buildExport() {
    var list = DATA.candidates.map(function (c) {
      return results[c.id] || {
        id: c.id, kind: c.kind, name: c.name, lat: c.lat, lon: c.lon,
        priority: c.priority, trustClass: c.trustClass, currentlyDisplayed: c.currentlyDisplayed,
        source: c.source, verdict: 'pending', note: ''
      };
    }).filter(function (r) { return r.verdict && r.verdict !== 'pending'; });
    return {
      type: 'pin-trust-review-results',
      exportedAt: new Date().toISOString(),
      dataGenerated: DATA.generated,
      summary: counts(),
      results: list
    };
  }

  function buildGroupsExport() {
    return {
      type: 'pin-feature-groups',
      exportedAt: new Date().toISOString(),
      note: 'Explicit feature groups from pin-trust-review.html. Members keep published coords (never nudged). Live dive/fish grouping unions matched pins even when names do not normalize together.',
      groups: featureGroups
    };
  }

  function downloadBlob(filename, text, mime) {
    var blob = new Blob([text], { type: mime || 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function exportJson() {
    downloadBlob('pin-trust-review-results.json', JSON.stringify(buildExport(), null, 2));
    toast('Downloaded pin-trust-review-results.json');
  }

  function exportGroupsJson() {
    var doc = buildGroupsExport();
    downloadBlob('pin-feature-groups.json', JSON.stringify(doc, null, 2));
    toast('Downloaded pin-feature-groups.json — save next to dashboard & rebuild');
  }

  function exportGroupsJs() {
    var doc = buildGroupsExport();
    var text =
      '/* Explicit pin feature groups — loaded by dashboard + dive-engine (file:// OK). */\n' +
      'window.PIN_FEATURE_GROUPS = ' + JSON.stringify(doc, null, 2) + ';\n';
    downloadBlob('pin-feature-groups-data.js', text, 'text/javascript');
    toast('Downloaded pin-feature-groups-data.js — replace beside dashboard');
  }

  function copyForChat() {
    var payload = buildExport();
    var text = 'Pin trust review results for Cursor:\n\n```json\n' + JSON.stringify(payload, null, 2) + '\n```\n';
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        toast('Copied — paste into the Cursor chat');
      }).catch(function () { fallbackCopy(text); });
    } else fallbackCopy(text);
  }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Copied — paste into the Cursor chat'); }
    catch (e) { toast('Copy failed — use Download instead'); }
    document.body.removeChild(ta);
  }

  function clearResults() {
    if (!confirm('Clear all local yes/no/unsure answers? (Bundled prior export will reload. Feature groups are kept.)')) return;
    results = {};
    seedFromPrior();
    save();
    renderList();
    if (activeId) selectCand(activeId);
    toast('Reset trust answers to prior export');
  }

  function importFile(ev) {
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var text = reader.result;
        if (/PIN_FEATURE_GROUPS\s*=/.test(text)) {
          text = text.replace(/^[\s\S]*?PIN_FEATURE_GROUPS\s*=\s*/, '').replace(/;\s*$/, '');
        }
        var data = JSON.parse(text);
        if (data.type === 'pin-feature-groups' || data.groups) {
          featureGroups = (data.groups || []).map(function (g) { return JSON.parse(JSON.stringify(g)); });
          saveGroups();
          toast('Imported ' + featureGroups.length + ' feature groups');
          if (activeId) selectCand(activeId);
          else updateStats();
        } else {
          var arr = data.results || [];
          arr.forEach(function (r) {
            if (r && r.id && r.verdict) results[r.id] = r;
          });
          save(); renderList();
          toast('Imported ' + arr.length + ' trust answers');
        }
      } catch (e) { toast('Invalid JSON'); }
    };
    reader.readAsText(f);
    ev.target.value = '';
  }

  document.getElementById('filterPri').onchange = renderList;
  document.getElementById('filterKind').onchange = renderList;
  document.getElementById('search').oninput = renderList;

  /**
   * Same idea as main Settings → Hard refresh: unregister SW, clear Cache Storage +
   * session scratch, then reload with ?_hr= cache-bust. Keeps pin-trust answers + groups.
   */
  async function hardRefreshReview(btnEl) {
    var btns = [document.getElementById('btnHardRefresh'), document.getElementById('btnHardRefreshPanel')];
    btns.forEach(function (b) {
      if (!b) return;
      b.disabled = true;
      b.textContent = 'Refreshing…';
    });
    if (btnEl) { btnEl.disabled = true; btnEl.textContent = 'Refreshing…'; }
    try {
      if (navigator.serviceWorker) {
        var regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(function (r) { return r.unregister().catch(function () { return false; }); }));
      }
    } catch (e) { /* ignore */ }
    try {
      if (typeof caches !== 'undefined' && caches.keys) {
        var keys = await caches.keys();
        await Promise.all(keys.map(function (k) { return caches.delete(k).catch(function () { return false; }); }));
      }
    } catch (e) { /* ignore */ }
    try {
      if (typeof sessionStorage !== 'undefined') sessionStorage.clear();
    } catch (e) { /* ignore */ }
    try {
      /* Drop ephemeral boatboard caches only — never wipe review answers / groups. */
      var drop = [];
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (!k) continue;
        if (k === STORAGE_KEY || k === GROUPS_KEY || k === DUAL_UNLINK_KEY) continue;
        if (k.indexOf('boatCache:') === 0 || k === 'habCharmLast' || k.indexOf('boatFib') === 0) drop.push(k);
      }
      drop.forEach(function (k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } });
    } catch (e) { /* ignore */ }
    var url = new URL(location.href);
    url.searchParams.set('_hr', String(Date.now()));
    location.replace(url.pathname + url.search + (url.hash || ''));
  }

  document.getElementById('btnHardRefresh').onclick = function () {
    hardRefreshReview(document.getElementById('btnHardRefresh'));
  };

  document.addEventListener('keydown', function (e) {
    if (e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
    if (!activeId) return;
    var k = e.key.toLowerCase();
    if (k === 'y') setVerdict(activeId, 'yes');
    else if (k === 'n') setVerdict(activeId, 'no');
    else if (k === 'u') setVerdict(activeId, 'unsure');
    else if (k === 'g') {
      var c = DATA.candidates.find(function (x) { return x.id === activeId; });
      if (c) addFocusToSel(c);
    }
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
  });

  renderList();
  initBasemap().then(function () {
    if (filtered.length) selectCand(filtered[0].id);
    else if (DATA.candidates.length) {
      document.getElementById('filterPri').value = 'all';
      renderList();
      if (filtered.length) selectCand(filtered[0].id);
    }
    setTimeout(function () { try { map.invalidateSize(true); } catch (e) { /* ignore */ } }, 80);
  });
})();
</script>
