<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <title>Windy map</title>
  <style>
    html, body, #windy { margin: 0; padding: 0; width: 100%; height: 100%; background: #0a121c; }
    #windy-status {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10000;
      padding: 8px 12px;
      background: rgba(180, 40, 40, 0.92);
      color: #fff;
      font: 13px/1.4 system-ui, sans-serif;
      text-align: center;
    }
    #windy-status.show { display: block; }
  </style>
</head>
<body>
  <div id="windy-status" role="alert"></div>
  <div id="windy"></div>
  <script src="https://unpkg.com/leaflet@1.4.0/dist/leaflet.js"></script>
  <script src="https://api.windy.com/assets/map-forecast/libBoot.js"></script>
  <script>
    (function(){
      var params = new URLSearchParams(location.search);
      var lat = parseFloat(params.get('lat'));
      var lon = parseFloat(params.get('lon'));
      if(!isFinite(lat)) lat = 33.848;
      if(!isFinite(lon)) lon = -118.396;
      var key = params.get('key') || 'AkUvStRT3vKB9WjogxlKxVGxkt1SjUyR';
      var zoom = parseInt(params.get('zoom') || '10', 10);
      /* overlay=waves|wind — never invalid "swell" (gray map). */
      var modeRaw = (params.get('overlay') || params.get('mode') || 'waves').toLowerCase();
      var MODE = modeRaw === 'wind' ? 'wind' : 'waves';
      /**
       * Map Forecast SDK often serves waves/swell "No data!" tiles past zoom 7
       * (community.windy.com/topic/44727). Wind tiles are fine at higher zoom.
       */
      var MAX_WAVES_ZOOM = 7;
      if(MODE === 'waves' && zoom > MAX_WAVES_ZOOM) zoom = MAX_WAVES_ZOOM;
      var statusEl = document.getElementById('windy-status');
      var overlayRendered = false;
      var failTimer = null;
      var metricGuardBound = false;
      /* Map Forecast API / embed2 accept waves + swell1/2 — NOT plain "swell" (breaks map). */
      var WAVE_OVERLAY_PREFER = ['waves', 'swell1', 'swell2', 'wwaves'];
      var WAVE_METRIC_OVERLAYS = ['waves', 'swell1', 'swell2', 'swell3', 'wwaves'];
      var activeOverlay = MODE === 'wind' ? 'wind' : 'waves';

      document.title = MODE === 'wind' ? 'Windy wind' : 'Windy waves';

      function showStatus(msg){
        statusEl.textContent = msg;
        statusEl.classList.add('show');
      }

      function notifyParent(type, detail){
        try{
          if(window.parent && window.parent !== window){
            window.parent.postMessage({ source: 'windy-waves-embed', type: type, detail: detail || null }, '*');
          }
        }catch(e){}
      }

      /** Free/testing keys: gfsWaves first. ecmwfWaves / ICON need higher tiers. */
      function pickWavesProduct(store){
        var allowed = store.getAllowed('product');
        if(!Array.isArray(allowed)) allowed = [];
        var prefer = ['gfsWaves', 'ecmwfWaves', 'iconWaves', 'iconEuWaves', 'canRdwpsWaves'];
        for(var i = 0; i < prefer.length; i++){
          if(allowed.indexOf(prefer[i]) >= 0) return prefer[i];
        }
        for(var j = 0; j < allowed.length; j++){
          if(/waves/i.test(allowed[j])) return allowed[j];
        }
        return 'gfsWaves';
      }

      /** Prefer significant waves (reliable), then primary swell — never invalid "swell". */
      function pickWaveOverlay(store){
        var allowed = store.getAllowed('overlay');
        if(!Array.isArray(allowed)) allowed = [];
        for(var i = 0; i < WAVE_OVERLAY_PREFER.length; i++){
          if(allowed.indexOf(WAVE_OVERLAY_PREFER[i]) >= 0) return WAVE_OVERLAY_PREFER[i];
        }
        return 'waves';
      }

      /**
       * Waves: metric_waves ft. Wind: metric_wind kt.
       * isImperial only seeds defaults; saved prefs/GeoIP can race until we forceChange.
       */
      function lockMetrics(api){
        try{
          var store = api.store;
          var overlays = api.overlays;
          if(store){
            store.set('isImperial', true, { forceChange: true });
            if(MODE === 'waves'){
              store.set('metric_waves', 'ft', { forceChange: true });
            }
            store.set('metric_wind', 'kt', { forceChange: true });
          }
          if(MODE === 'waves'){
            for(var i = 0; i < WAVE_METRIC_OVERLAYS.length; i++){
              var name = WAVE_METRIC_OVERLAYS[i];
              try{
                if(overlays && overlays[name] && typeof overlays[name].setMetric === 'function'){
                  overlays[name].setMetric('ft');
                }
              }catch(e1){}
            }
          }
          try{ if(overlays && overlays.wind) overlays.wind.setMetric('kt'); }catch(e2){}
          try{ if(overlays && overlays.temp) overlays.temp.setMetric('\u00B0F'); }catch(e3){}
        }catch(e){ console.warn('Windy metric lock', e); }
      }

      function bindMetricGuard(api){
        if(metricGuardBound) return;
        metricGuardBound = true;
        try{
          if(api.broadcast){
            api.broadcast.on('metricChanged', function(overlay, metric){
              if(MODE === 'waves' && WAVE_METRIC_OVERLAYS.indexOf(overlay) >= 0 && metric !== 'ft'){
                lockMetrics(api);
              }
              if(overlay === 'wind' && metric !== 'kt'){
                lockMetrics(api);
              }
            });
            api.broadcast.on('redrawFinished', function(){
              try{
                if(MODE === 'waves' && api.store && api.store.get('metric_waves') !== 'ft') lockMetrics(api);
                else if(MODE === 'wind' && api.store && api.store.get('metric_wind') !== 'kt') lockMetrics(api);
              }catch(e){ lockMetrics(api); }
            });
          }
          if(api.store && typeof api.store.on === 'function'){
            if(MODE === 'waves'){
              api.store.on('metric_waves', function(metric){
                if(metric !== 'ft') lockMetrics(api);
              });
            }
            api.store.on('metric_wind', function(metric){
              if(metric !== 'kt') lockMetrics(api);
            });
          }
        }catch(e){ console.warn('Windy metric guard', e); }
      }

      /** Keep wave tiles in the SDK's reliable zoom range if the user pans/zooms. */
      function clampWavesZoom(api){
        if(MODE !== 'waves' || !api || !api.map) return;
        try{
          var map = api.map;
          if(typeof map.setMaxZoom === 'function') map.setMaxZoom(MAX_WAVES_ZOOM);
          else if(map.options) map.options.maxZoom = MAX_WAVES_ZOOM;
          if(typeof map.getZoom === 'function' && map.getZoom() > MAX_WAVES_ZOOM){
            map.setZoom(MAX_WAVES_ZOOM);
          }
          if(!map._boatboardWavesZoomBound && typeof map.on === 'function'){
            map._boatboardWavesZoomBound = true;
            map.on('zoomend', function(){
              try{
                if(map.getZoom() > MAX_WAVES_ZOOM) map.setZoom(MAX_WAVES_ZOOM);
              }catch(e){}
            });
          }
        }catch(e){ console.warn('Windy waves zoom clamp', e); }
      }

      function afterOverlayReady(api, product, usedFallback){
        if(overlayRendered) return;
        overlayRendered = true;
        if(failTimer) clearTimeout(failTimer);
        clampWavesZoom(api);
        lockMetrics(api);
        setTimeout(function(){ lockMetrics(api); }, 0);
        setTimeout(function(){ lockMetrics(api); }, 250);
        setTimeout(function(){ lockMetrics(api); }, 1000);
        try{ api.store.set('particlesAnim', 'on'); }catch(e0){}
        try{ api.picker.open({ lat: lat, lon: lon }); }catch(e){}
        var metricWaves = null;
        var metricWind = null;
        try{ metricWaves = api.store.get('metric_waves'); }catch(e2){}
        try{ metricWind = api.store.get('metric_wind'); }catch(e3){}
        notifyParent('windy-ready', {
          mode: MODE,
          product: product,
          fallback: !!usedFallback,
          overlay: api.store.get('overlay') || activeOverlay,
          zoom: api.map && api.map.getZoom ? api.map.getZoom() : zoom,
          metricWaves: metricWaves,
          metricWind: metricWind
        });
      }

      function loadOverlay(api, product, overlay, usedFallback){
        var store = api.store;
        var broadcast = api.broadcast;
        activeOverlay = overlay || (MODE === 'wind' ? 'wind' : 'waves');

        broadcast.once('redrawFinished', function(){
          afterOverlayReady(api, store.get('product') || product, usedFallback);
        });

        try{
          /* Product before overlay so the first wave tile request uses a wave model. */
          if(product) store.set('product', product);
          store.set('overlay', activeOverlay);
        }catch(e){
          console.warn('Windy overlay/product set', e);
          try{
            if(MODE === 'waves'){
              store.set('product', 'gfsWaves', { forceChange: true });
              store.set('overlay', 'waves', { forceChange: true });
              activeOverlay = 'waves';
            }else{
              store.set('overlay', 'wind', { forceChange: true });
              activeOverlay = 'wind';
            }
          }catch(e2){}
        }
        clampWavesZoom(api);
        lockMetrics(api);
      }

      function onReady(api){
        var store = api.store;
        bindMetricGuard(api);
        clampWavesZoom(api);
        lockMetrics(api);

        if(MODE === 'wind'){
          loadOverlay(api, null, 'wind', false);
          failTimer = setTimeout(function(){
            if(overlayRendered) return;
            var curOverlay = store.get('overlay');
            if(curOverlay !== 'wind'){
              loadOverlay(api, null, 'wind', true);
              return;
            }
            showStatus('Wind overlay failed to load — check API key tier and domain restrictions.');
            notifyParent('windy-overlay-failed', { mode: MODE, overlay: curOverlay });
          }, 12000);
          return;
        }

        var product = pickWavesProduct(store);
        var overlay = pickWaveOverlay(store);
        loadOverlay(api, product, overlay, false);

        failTimer = setTimeout(function(){
          if(overlayRendered) return;
          var current = store.get('product');
          var curOverlay = store.get('overlay');
          /* Second chance: force significant-waves + GFS (widest free-tier support). */
          if(curOverlay !== 'waves' || current !== 'gfsWaves'){
            loadOverlay(api, 'gfsWaves', 'waves', true);
            return;
          }
          showStatus('Waves overlay failed to load — check API key tier and domain restrictions.');
          notifyParent('windy-overlay-failed', { mode: MODE, product: current, overlay: curOverlay });
        }, 12000);
      }

      try{
        var initOpts = {
          key: key,
          lat: lat,
          lon: lon,
          zoom: zoom,
          overlay: MODE === 'wind' ? 'wind' : 'waves',
          level: 'surface',
          isImperial: true
        };
        /* Startup product avoids a first paint with a non-wave model → empty tiles. */
        if(MODE === 'waves') initOpts.product = 'gfsWaves';
        windyInit(initOpts, onReady);
      }catch(e){
        showStatus('Windy init failed: ' + (e.message || e));
        notifyParent('windy-overlay-failed', { mode: MODE, error: String(e) });
      }
    })();
  </script>
</body>
</html>
