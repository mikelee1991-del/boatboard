<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <title>Windy waves</title>
  <style>
    html, body, #windy { margin: 0; padding: 0; width: 100%; height: 100%; background: #0a121c; }
    #windy-status {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10000;
      padding: 8px 12px;
      background: rgba(180, 40, 40, 0.92);
      color: #fff;
      font: 13px/1.4 system-ui, sans-serif;
      text-align: center;
    }
    #windy-status.show { display: block; }
  </style>
</head>
<body>
  <div id="windy-status" role="alert"></div>
  <div id="windy"></div>
  <script src="https://unpkg.com/leaflet@1.4.0/dist/leaflet.js"></script>
  <script src="https://api.windy.com/assets/map-forecast/libBoot.js"></script>
  <script>
    (function(){
      var params = new URLSearchParams(location.search);
      var lat = parseFloat(params.get('lat'));
      var lon = parseFloat(params.get('lon'));
      if(!isFinite(lat)) lat = 33.848;
      if(!isFinite(lon)) lon = -118.396;
      var key = params.get('key') || 'AkUvStRT3vKB9WjogxlKxVGxkt1SjUyR';
      var zoom = parseInt(params.get('zoom') || '10', 10);
      var statusEl = document.getElementById('windy-status');
      var overlayRendered = false;
      var failTimer = null;
      var ftGuardBound = false;
      /* Map Forecast API / embed2 accept waves + swell1/2 — NOT plain "swell" (breaks map). */
      var WAVE_OVERLAY_PREFER = ['waves', 'swell1', 'swell2', 'wwaves'];
      var WAVE_METRIC_OVERLAYS = ['waves', 'swell1', 'swell2', 'swell3', 'wwaves'];
      var activeOverlay = 'waves';

      function showStatus(msg){
        statusEl.textContent = msg;
        statusEl.classList.add('show');
      }

      function notifyParent(type, detail){
        try{
          if(window.parent && window.parent !== window){
            window.parent.postMessage({ source: 'windy-waves-embed', type: type, detail: detail || null }, '*');
          }
        }catch(e){}
      }

      /** Testing/free keys only include gfsWaves — ecmwfWaves needs Professional tier. */
      function pickWavesProduct(store){
        var allowed = store.getAllowed('product');
        if(!Array.isArray(allowed)) allowed = [];
        var prefer = ['ecmwfWaves', 'gfsWaves', 'iconWaves', 'iconEuWaves', 'canRdwpsWaves'];
        for(var i = 0; i < prefer.length; i++){
          if(allowed.indexOf(prefer[i]) >= 0) return prefer[i];
        }
        for(var j = 0; j < allowed.length; j++){
          if(/waves/i.test(allowed[j])) return allowed[j];
        }
        return 'gfsWaves';
      }

      /** Prefer significant waves (reliable), then primary swell — never invalid "swell". */
      function pickWaveOverlay(store){
        var allowed = store.getAllowed('overlay');
        if(!Array.isArray(allowed)) allowed = [];
        for(var i = 0; i < WAVE_OVERLAY_PREFER.length; i++){
          if(allowed.indexOf(WAVE_OVERLAY_PREFER[i]) >= 0) return WAVE_OVERLAY_PREFER[i];
        }
        return 'waves';
      }

      /**
       * Wave height units live in store key metric_waves (defaults: ["m","ft"]).
       * isImperial only seeds the *default*; a saved "m" (or GeoIP race) stays until
       * store.set('metric_waves','ft') / overlays.waves.setMetric('ft') — same pattern
       * embed2 uses for metric_wind / metric_temp / metric_rain.
       */
      function lockFeet(api){
        try{
          var store = api.store;
          var overlays = api.overlays;
          if(store){
            store.set('isImperial', true, { forceChange: true });
            store.set('metric_waves', 'ft', { forceChange: true });
          }
          for(var i = 0; i < WAVE_METRIC_OVERLAYS.length; i++){
            var name = WAVE_METRIC_OVERLAYS[i];
            try{
              if(overlays && overlays[name] && typeof overlays[name].setMetric === 'function'){
                overlays[name].setMetric('ft');
              }
            }catch(e1){}
          }
          try{ if(overlays && overlays.wind) overlays.wind.setMetric('kt'); }catch(e2){}
          try{ if(overlays && overlays.temp) overlays.temp.setMetric('\u00B0F'); }catch(e3){}
        }catch(e){ console.warn('Windy feet lock', e); }
      }

      function bindFeetGuard(api){
        if(ftGuardBound) return;
        ftGuardBound = true;
        try{
          if(api.broadcast){
            api.broadcast.on('metricChanged', function(overlay, metric){
              if(WAVE_METRIC_OVERLAYS.indexOf(overlay) >= 0 && metric !== 'ft'){
                lockFeet(api);
              }
            });
            api.broadcast.on('redrawFinished', function(){
              try{
                if(api.store && api.store.get('metric_waves') !== 'ft') lockFeet(api);
              }catch(e){ lockFeet(api); }
            });
          }
          if(api.store && typeof api.store.on === 'function'){
            api.store.on('metric_waves', function(metric){
              if(metric !== 'ft') lockFeet(api);
            });
          }
        }catch(e){ console.warn('Windy feet guard', e); }
      }

      function afterOverlayReady(api, product, usedFallback){
        if(overlayRendered) return;
        overlayRendered = true;
        if(failTimer) clearTimeout(failTimer);
        lockFeet(api);
        /* Re-assert after Windy finishes legend/picker paint (saved metric_waves=m can win races). */
        setTimeout(function(){ lockFeet(api); }, 0);
        setTimeout(function(){ lockFeet(api); }, 250);
        setTimeout(function(){ lockFeet(api); }, 1000);
        try{ api.picker.open({ lat: lat, lon: lon }); }catch(e){}
        var waveMetric = null;
        try{ waveMetric = api.store.get('metric_waves'); }catch(e2){}
        notifyParent('windy-ready', {
          product: product,
          fallback: !!usedFallback,
          overlay: api.store.get('overlay') || activeOverlay,
          metricWaves: waveMetric
        });
      }

      function loadWaves(api, product, overlay, usedFallback){
        var store = api.store;
        var broadcast = api.broadcast;
        activeOverlay = overlay || 'waves';

        broadcast.once('redrawFinished', function(){
          afterOverlayReady(api, store.get('product') || product, usedFallback);
        });

        try{
          store.set('overlay', activeOverlay);
          store.set('product', product);
        }catch(e){
          console.warn('Windy overlay/product set', e);
          try{
            store.set('overlay', 'waves', { forceChange: true });
            store.set('product', 'gfsWaves', { forceChange: true });
            activeOverlay = 'waves';
          }catch(e2){}
        }
        lockFeet(api);
      }

      function onReady(api){
        var store = api.store;
        bindFeetGuard(api);
        lockFeet(api);
        var product = pickWavesProduct(store);
        var overlay = pickWaveOverlay(store);
        loadWaves(api, product, overlay, false);

        failTimer = setTimeout(function(){
          if(overlayRendered) return;
          var current = store.get('product');
          var curOverlay = store.get('overlay');
          /* Second chance: force significant-waves + GFS (widest free-tier support). */
          if(curOverlay !== 'waves' || current !== 'gfsWaves'){
            loadWaves(api, 'gfsWaves', 'waves', true);
            return;
          }
          showStatus('Waves overlay failed to load — check API key tier and domain restrictions.');
          notifyParent('windy-overlay-failed', { product: current, overlay: curOverlay });
        }, 12000);
      }

      try{
        windyInit({
          key: key,
          lat: lat,
          lon: lon,
          zoom: zoom,
          overlay: 'waves',
          isImperial: true
        }, onReady);
      }catch(e){
        showStatus('Windy init failed: ' + (e.message || e));
        notifyParent('windy-overlay-failed', { error: String(e) });
      }
    })();
  </script>
</body>
</html>
